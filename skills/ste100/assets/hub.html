html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--sans);display:flex;flex-direction:column;overflow:hidden}

nav a{font:500 13px var(--sans);color:var(--ink);text-decoration:none;border:1.5px solid var(--line);padding:5px 14px;background:var(--sheet);display:flex;gap:8px;align-items:center}
nav a::before{content:"";width:10px;height:10px}
nav a.pic::before{background:var(--pic)}nav a.ste::before{background:var(--ste)}

nav a.off{opacity:.45;pointer-events:none}

.views iframe{width:100%;height:100%;border:0;background:var(--sheet);min-height:0}

<script>
(function () {
  var views = document.querySelector(".views");
  var map = {"#system": "pic", "#ste100": "ste"};
  var hasPic = __HAS_PIC__;
  function show() {
    var v = map[location.hash] || (hasPic ? "pic" : "ste");
    if (!hasPic) v = "ste";
